    <!-- Leaves -->
    <path d="M51 75 C55 75 65 72 68 68 C65 68 55 65 52 70" fill="#1B3B6F" fill-opacity="0.9"/>
    <path d="M49 72 C45 72 35 69 32 65 C35 65 45 62 48 67" fill="#1B3B6F" fill-opacity="0.9"/>
    
    <path d="M52 55 C56 55 66 52 69 48 C66 48 56 45 53 50" fill="#1B3B6F" fill-opacity="0.9"/>
    <path d="M48 52 C44 52 34 49 31 45 C34 45 44 42 47 47" fill="#1B3B6F" fill-opacity="0.9"/>

    <path d="M51 35 C55 35 65 32 68 28 C65 28 55 25 52 30" fill="#1B3B6F" fill-opacity="0.9"/>
    <path d="M47 32 C43 32 33 29 30 25 C33 25 43 22 46 27" fill="#1B3B6F" fill-opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="50" y="125" text-anchor="middle" fill="#1B3B6F" font-size="28" class="title">indigo</text>
  <text x="50" y="140" text-anchor="middle" fill="#8D6E63" font-size="5" class="subtitle">Circular Fashion</text>
</svg>