<svg width="500" height="600" viewBox="-10 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&amp;family=Lato:wght@300&amp;display=swap');
      .title {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 400;
      }
      .subtitle {
        font-family: 'Lato', sans-serif;
        font-weight: 300;
        letter-spacing: 0.4em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Plant Graphic -->
  <g id="icon">
    <!-- Stem -->
